# Entorno completo con contenedores (desarrollo o servidor único).
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: sgee
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host port 5433 avoids clashing with a locally installed PostgreSQL.
    ports: ["${SGEE_DB_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  clamav:
    image: clamav/clamav:stable
    profiles: ["security"]
    ports: ["3310:3310"]

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sgee}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sgee-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  migrate:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    # Creates the app role, applies migrations/RLS and loads the idempotent seed
    # (real-school base, optional admin from SEED_ADMIN_*, demo tenant).
    command: ["sh", "-c", "npm run setup -w @sgee/db"]
    env_file: ../.env
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sgee
      DATABASE_URL: postgresql://sgee_app:${DB_APP_PASSWORD}@postgres:5432/sgee
      TEST_DATABASE_ADMIN_URL: ""
      TEST_DATABASE_URL: ""
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://sgee_app:${DB_APP_PASSWORD}@postgres:5432/sgee
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sgee
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      STORAGE_LOCAL_DIR: /data/storage
      PG_BIN: /usr/bin
      # Set SGEE_JOBS_ENABLED=false for a throwaway test stack (no Phidias/S3 syncs, no alerts).
      JOBS_ENABLED: ${SGEE_JOBS_ENABLED:-true}
      WEB_ORIGIN: http://localhost:${SGEE_WEB_PORT:-3100}
      PUBLIC_WEB_URL: http://localhost:${SGEE_WEB_PORT:-3100}
    volumes: [storage:/data/storage]
    ports: ["${SGEE_API_PORT:-4000}:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 15s

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_WS_URL: http://localhost:${SGEE_API_PORT:-4000}
        API_INTERNAL_URL: http://api:4000
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_WS_URL: http://localhost:${SGEE_API_PORT:-4000}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3100}
    ports: ["${SGEE_WEB_PORT:-3100}:3100"]
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web, api]

volumes:
  pgdata:
  storage:
  miniodata:
  caddydata:
